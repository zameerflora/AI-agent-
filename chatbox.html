<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green AI Assistant</title>
    <style>
        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --light-green: #d5f5e3;
            --bg-green: #e8f8f0;
            --text-dark: #2c3e50;
            --text-light: #ecf0f1;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-green);
            margin: 0;
            padding: 20px;
        }
        
        .chat-container {
            width: 100%;
            max-width: 500px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
            border: 2px solid var(--dark-green);
        }
        
        .chat-header {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            color: var(--text-light);
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            position: relative;
        }
        
        .greenwish-label {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 12px;
            background-color: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        
        .chat-body {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            background-color: var(--light-green);
        }
        
        .timestamp {
            text-align: center;
            color: var(--dark-green);
            font-size: 12px;
            margin: 15px 0;
            font-weight: bold;
        }
        
        .message {
            margin-bottom: 12px;
            display: flex;
        }
        
        .message.received {
            justify-content: flex-start;
        }
        
        .message.sent {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            position: relative;
        }
        
        .received .message-content {
            background-color: white;
            border-top-left-radius: 4px;
            color: var(--text-dark);
            border: 1px solid var(--primary-green);
        }
        
        .sent .message-content {
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            color: var(--text-light);
            border-top-right-radius: 4px;
        }
        
        .chat-footer {
            padding: 15px;
            background-color: white;
            border-top: 1px solid var(--primary-green);
            display: flex;
            gap: 10px;
        }
        
        #message-input {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid var(--primary-green);
            border-radius: 24px;
            outline: none;
            font-size: 16px;
        }
        
        #message-input:focus {
            border-color: var(--dark-green);
        }
        
        #send-button {
            background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
            color: white;
            border: none;
            border-radius: 24px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #send-button:hover {
            opacity: 0.9;
        }
        
        .typing-indicator {
            display: flex;
            padding: 12px 16px;
            background-color: white;
            border-radius: 18px;
            width: fit-content;
            border: 1px solid var(--primary-green);
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary-green);
            border-radius: 50%;
            margin: 0 2px;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typingAnimation {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        
        .ai-label {
            font-size: 10px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="greenwish-label">GREENWISH</div>
            Eco AI Assistant
        </div>
        
        <div class="chat-body" id="chat-body">
            <div class="timestamp">Today</div>
            
            <!-- Initial AI message -->
            <div class="message sent">
                <div class="message-content">
                    Hello! I'm your green-themed AI assistant. Ask me anything!
                    <div class="ai-label">AI Assistant</div>
                </div>
            </div>
        </div>
        
        <div class="chat-footer">
            <input type="text" id="message-input" placeholder="Type your message here..." autocomplete="off">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        const chatBody = document.getElementById('chat-body');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        
        // Function to add a user message
        function addUserMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message received';
            messageDiv.innerHTML = `
                <div class="message-content">${message}</div>
            `;
            chatBody.appendChild(messageDiv);
            messageInput.value = '';
            chatBody.scrollTop = chatBody.scrollHeight;
            
            // Show typing indicator
            showTypingIndicator();
        }
        
        // Function to show typing indicator
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message sent';
            typingDiv.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatBody.appendChild(typingDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
            
            // Get AI response
            getAIResponse(messageInput.value.trim());
        }
        
        // Function to get AI response from OpenAI API
        async function getAIResponse(userMessage) {
            try {
                // Replace with your actual API key and endpoint
                const apiKey = 'YOUR_OPENAI_API_KEY'; // You need to get this from OpenAI
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [
                            {"role": "system", "content": "You are a helpful AI assistant with a focus on eco-friendly and green solutions."},
                            {"role": "user", "content": userMessage}
                        ],
                        temperature: 0.7
                    })
                });
                
                const data = await response.json();
                const aiMessage = data.choices[0].message.content;
                
                // Remove typing indicator
                const typingIndicator = document.querySelector('.typing-indicator');
                if (typingIndicator) {
                    typingIndicator.parentElement.remove();
                }
                
                // Add AI response
                addAiResponse(aiMessage);
            } catch (error) {
                console.error("Error getting AI response:", error);
                // Fallback response if API fails
                addAiResponse("I'm having trouble connecting to the AI service. Please try again later.");
            }
        }
        
        // Function to add AI response
        function addAiResponse(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message sent';
            messageDiv.innerHTML = `
                <div class="message-content">
                    ${message}
                    <div class="ai-label">AI Assistant</div>
                </div>
            `;
            chatBody.appendChild(messageDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }
        
        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                addUserMessage(message);
            }
        }
    </script>
</body>
</html>
